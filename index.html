<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數字等式認知遊戲</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #edf3fb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            color: #2563eb;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .info-item {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .question-box {
            background-color: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .question {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .feedback {
            margin-top: 1rem;
            font-size: 1.2rem;
        }
        .success {
            color: #16a34a;
        }
        .error {
            color: #dc2626;
        }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }
        .number-btn {
            background-color: #dbeafe;
            border: none;
            border-radius: 0.5rem;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }
        .number-btn:active {
            transform: scale(0.95);
            background-color: #93c5fd;
        }
        .number-btn.correct {
            background-color: #22c55e;
            color: white;
        }
        .number-btn.wrong {
            background-color: #ef4444;
            color: white;
        }
        .mode-section {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .mode-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            width: 120px;
            white-space: nowrap;
        }
        .mode-btn.active {
            background-color: #2563eb;
            color: white;
        }
        .mode-btn.inactive {
            background-color: #dbeafe;
            color: #1e3a8a;
        }
        .start-btn {
            display: block;
            margin: 1.5rem auto;
            padding: 0.75rem 1.5rem;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .start-btn:hover {
            background-color: #059669;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        th {
            background-color: #dbeafe;
            padding: 0.75rem 0.5rem;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        td {
            padding: 0.75rem 0.5rem;
            text-align: center;
            font-size: 0.9rem;
            border-bottom: 1px solid #f3f4f6;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .high-score {
            background-color: #f0f7ff;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .high-score h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .score-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="game"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const game = {
                // 遊戲狀態
                state: {
                    level: 1,
                    score: 0,
                    wrongAnswers: 0,
                    totalAttempts: 0,
                    currentQuestion: null,
                    feedback: '',
                    timeLeft: 30,
                    isPlaying: false,
                    mode: '30秒',
                    selectedNumber: null,
                    answered: false,
                    questions: [],
                    questionIndex: 0,
                    timer: null,
                    highScores30: [],
                    highScores60: [],
                    recentGames: []
                },

                // 初始化
                init: function() {
                    this.loadData();
                    this.render();
                },

                // 載入遊戲數據
                loadData: function() {
                    try {
                        const highScores30 = localStorage.getItem('highScores30');
                        const highScores60 = localStorage.getItem('highScores60');
                        const recentGames = localStorage.getItem('recentGames');

                        this.state.highScores30 = highScores30 ? JSON.parse(highScores30) : [];
                        this.state.highScores60 = highScores60 ? JSON.parse(highScores60) : [];
                        this.state.recentGames = recentGames ? JSON.parse(recentGames) : [];

                        if (!Array.isArray(this.state.highScores30)) this.state.highScores30 = [];
                        if (!Array.isArray(this.state.highScores60)) this.state.highScores60 = [];
                        if (!Array.isArray(this.state.recentGames)) this.state.recentGames = [];
                    } catch (error) {
                        console.error('載入數據錯誤:', error);
                        this.state.highScores30 = [];
                        this.state.highScores60 = [];
                        this.state.recentGames = [];
                    }
                },

                // 切換模式
                switchMode: function(mode) {
                    this.state.mode = mode;
                    this.render();
                },

                // 生成問題
                generateQuestion: function() {
                    const max = Math.min(9, 3 + this.state.level);
                    const min = Math.max(1, this.state.level - 2);
                    
                    // 決定是加法還是減法
                    const isAddition = Math.random() > 0.5;
                    
                    let a, b, result, question, answer;
                    
                    if (isAddition) {
                        a = Math.floor(Math.random() * (max - min + 1)) + min;
                        b = Math.floor(Math.random() * (max - min + 1)) + min;
                        result = a + b;
                        
                        if (result > 9) {
                            b = Math.min(9 - a, b);
                            result = a + b;
                        }
                    } else {
                        result = Math.floor(Math.random() * (max - min + 1)) + min;
                        a = result + Math.floor(Math.random() * (Math.min(9 - result, 9 - 1) + 1));
                        b = a - result;
                    }
                    
                    // 決定隱藏位置
                    const position = Math.floor(Math.random() * 3);
                    
                    if (isAddition) {
                        switch (position) {
                            case 0: question = `? + ${b} = ${result}`; answer = a; break;
                            case 1: question = `${a} + ? = ${result}`; answer = b; break;
                            case 2: question = `${a} + ${b} = ?`; answer = result; break;
                            default: question = `${a} + ${b} = ?`; answer = result;
                        }
                    } else {
                        switch (position) {
                            case 0: question = `? - ${b} = ${result}`; answer = a; break;
                            case 1: question = `${a} - ? = ${result}`; answer = b; break;
                            case 2: question = `${a} - ${b} = ?`; answer = result; break;
                            default: question = `${a} - ${b} = ?`; answer = result;
                        }
                    }
                    
                    return { question, answer };
                },

                // 開始遊戲
                startGame: function() {
                    // 清除上一局的計時器
                    if (this.state.timer) {
                        clearInterval(this.state.timer);
                    }
                    
                    // 重置遊戲狀態
                    this.state.level = 1;
                    this.state.score = 0;
                    this.state.wrongAnswers = 0;
                    this.state.totalAttempts = 0;
                    this.state.feedback = '';
                    this.state.timeLeft = this.state.mode === '30秒' ? 30 : 60;
                    this.state.isPlaying = true;
                    this.state.answered = false;
                    this.state.selectedNumber = null;
                    
                    // 生成題目
                    this.state.questions = Array(50).fill().map(() => this.generateQuestion());
                    this.state.questionIndex = 0;
                    this.state.currentQuestion = this.state.questions[0];
                    
                    // 啟動計時器
                    this.state.timer = setInterval(() => {
                        this.state.timeLeft--;
                        this.render();
                        
                        if (this.state.timeLeft <= 0) {
                            this.endGame();
                        }
                    }, 1000);
                    
                    this.render();
                },

                // 檢查答案
                checkAnswer: function(number) {
                    if (this.state.answered) return;
                    
                    this.state.selectedNumber = number;
                    this.state.totalAttempts++;
                    
                    const isCorrect = number === this.state.currentQuestion.answer;
                    
                    if (isCorrect) {
                        this.state.score++;
                        this.state.level = Math.floor(this.state.score / 3) + 1;
                        this.state.feedback = '正確！';
                        this.state.answered = true;
                        
                        this.render();
                        
                        // 延遲切換到下一題
                        setTimeout(() => {
                            if (this.state.questionIndex < this.state.questions.length - 1) {
                                this.state.questionIndex++;
                                this.state.currentQuestion = this.state.questions[this.state.questionIndex];
                                this.state.answered = false;
                                this.state.feedback = '';
                                this.state.selectedNumber = null;
                                this.render();
                            } else {
                                this.endGame();
                            }
                        }, 300);
                    } else {
                        this.state.wrongAnswers++;
                        this.state.feedback = `錯誤！正確答案是 ${this.state.currentQuestion.answer}`;
                        this.state.answered = true;
                        
                        this.render();
                        
                        // 延遲切換到下一題
                        setTimeout(() => {
                            if (this.state.questionIndex < this.state.questions.length - 1) {
                                this.state.questionIndex++;
                                this.state.currentQuestion = this.state.questions[this.state.questionIndex];
                                this.state.answered = false;
                                this.state.feedback = '';
                                this.state.selectedNumber = null;
                                this.render();
                            } else {
                                this.endGame();
                            }
                        }, 800);
                    }
                },

                // 計算PR值
                calculatePR: function(score) {
                    const normalDistribution = {
                        '30秒': [12, 5],
                        '60秒': [24, 8]
                    };
                    
                    const [mean, stdDev] = normalDistribution[this.state.mode];
                    const zScore = (score - mean) / stdDev;
                    const pr = Math.round(100 * (0.5 + 0.5 * Math.tanh(Math.sqrt(Math.PI/8) * zScore)));
                    
                    return Math.min(Math.max(pr, 1), 99);
                },

                // 格式化時間
                formatTime: function(date) {
                    const d = new Date(date);
                    const month = d.getMonth() + 1;
                    const day = d.getDate();
                    const hours = d.getHours();
                    const minutes = d.getMinutes();
                    
                    return `${month}/${day} ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                },

                // 結束遊戲
                endGame: function() {
                    // 停止計時器
                    clearInterval(this.state.timer);
                    
                    const score = this.state.score;
                    const mode = this.state.mode;
                    
                    // 計算PR和正確率
                    const pr = this.calculatePR(score);
                    const accuracy = this.state.totalAttempts > 0 
                        ? Math.round((score / this.state.totalAttempts) * 100) 
                        : 0;
                    
                    // 更新高分榜
                    const highScores = mode === '30秒' ? this.state.highScores30 : this.state.highScores60;
                    
                    highScores.push({
                        score: score,
                        date: this.formatTime(new Date())
                    });
                    
                    highScores.sort((a, b) => b.score - a.score);
                    
                    // 只保留前兩名
                    const topScores = highScores.slice(0, 2);
                    
                    if (mode === '30秒') {
                        this.state.highScores30 = topScores;
                        localStorage.setItem('highScores30', JSON.stringify(topScores));
                    } else {
                        this.state.highScores60 = topScores;
                        localStorage.setItem('highScores60', JSON.stringify(topScores));
                    }
                    
                    // 更新最近遊戲記錄
                    const newGame = {
                        date: this.formatTime(new Date()),
                        mode: mode,
                        score: score,
                        wrongAnswers: this.state.wrongAnswers,
                        accuracy: accuracy,
                        pr: pr
                    };
                    
                    this.state.recentGames.unshift(newGame);
                    if (this.state.recentGames.length > 5) {
                        this.state.recentGames = this.state.recentGames.slice(0, 5);
                    }
                    
                    localStorage.setItem('recentGames', JSON.stringify(this.state.recentGames));
                    
                    // 更新遊戲狀態
                    this.state.isPlaying = false;
                    this.state.feedback = `遊戲結束！答對：${score}題，答錯：${this.state.wrongAnswers}題，正確率：${accuracy}%，PR值：${pr}`;
                    
                    this.render();
                },

                // 渲染畫面
                render: function() {
                    const gameElement = document.getElementById('game');
                    
                    if (!this.state.isPlaying) {
                        // 主頁面
                        
                        // 生成高分榜
                        const highScores = this.state.mode === '30秒' 
                            ? this.state.highScores30 
                            : this.state.highScores60;
                            
                        let highScoreHTML = '';
                        
                        if (highScores.length > 0) {
                            highScoreHTML = `
                                <div class="high-score">
                                    <h3>${this.state.mode}模式最高記錄:</h3>
                                    ${highScores.map((score, index) => `
                                        <div class="score-item">
                                            <span>${index + 1}. ${score.score}分</span>
                                            <span>${score.date || '未知日期'}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                        }
                        
                        // 生成最近記錄
                        let recentGamesHTML = '';
                        
                        if (this.state.recentGames.length > 0) {
                            recentGamesHTML = `
                                <h3 style="margin-top: 1.5rem; margin-bottom: 0.5rem; font-size: 1.2rem;">最近遊戲記錄:</h3>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>模式</th>
                                            <th>答對</th>
                                            <th>答錯</th>
                                            <th>正確率</th>
                                            <th>PR值</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${this.state.recentGames.map(game => `
                                            <tr>
                                                <td>${game.mode || '—'}</td>
                                                <td>${game.score !== undefined ? game.score : '—'}</td>
                                                <td>${game.wrongAnswers !== undefined ? game.wrongAnswers : '—'}</td>
                                                <td>${game.accuracy !== undefined ? game.accuracy + '%' : '—'}</td>
                                                <td>${game.pr !== undefined ? game.pr : '—'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            `;
                        }
                        
                        gameElement.innerHTML = `
                            <h1>數字等式認知遊戲</h1>
                            
                            <p style="text-align: center; margin-bottom: 1.5rem;">
                                ${this.state.feedback || '歡迎來到數字等式認知遊戲！請選擇時間模式並點擊開始按鈕。'}
                            </p>
                            
                            <div class="mode-section">
                                <button class="mode-btn ${this.state.mode === '30秒' ? 'active' : 'inactive'}" id="mode-30">
                                    30秒模式
                                </button>
                                <button class="mode-btn ${this.state.mode === '60秒' ? 'active' : 'inactive'}" id="mode-60">
                                    60秒模式
                                </button>
                            </div>
                            
                            <p style="text-align: center; margin-bottom: 1rem;">
                                目前模式: <strong>${this.state.mode}</strong>
                            </p>
                            
                            ${highScoreHTML}
                            
                            ${recentGamesHTML}
                            
                            <button class="start-btn" id="start-btn">開始遊戲</button>
                        `;
                        
                        // 添加事件監聽器
                        document.getElementById('mode-30').addEventListener('click', () => this.switchMode('30秒'));
                        document.getElementById('mode-60').addEventListener('click', () => this.switchMode('60秒'));
                        document.getElementById('start-btn').addEventListener('click', () => this.startGame());
                        
                    } else {
                        // 遊戲中
                        
                        // 生成數字按鈕
                        let numbersHTML = '';
                        
                        for (let i = 1; i <= 9; i++) {
                            const isSelected = this.state.selectedNumber === i;
                            const isCorrect = isSelected && i === this.state.currentQuestion.answer;
                            const isWrong = isSelected && i !== this.state.currentQuestion.answer;
                            
                            let btnClass = '';
                            if (isCorrect) btnClass = 'correct';
                            else if (isWrong) btnClass = 'wrong';
                            
                            numbersHTML += `
                                <button 
                                    class="number-btn ${btnClass}" 
                                    id="num-${i}" 
                                    ${this.state.answered ? 'disabled' : ''}
                                >
                                    ${i}
                                </button>
                            `;
                        }
                        
                        gameElement.innerHTML = `
                            <h1>數字等式認知遊戲</h1>
                            
                            <div class="game-info">
                                <div class="info-item">等級: <strong>${this.state.level}</strong></div>
                                <div class="info-item">分數: <strong>${this.state.score}</strong></div>
                                <div class="info-item">時間: <strong>${this.state.timeLeft}</strong></div>
                            </div>
                            
                            <div class="question-box">
                                <div class="question">${this.state.currentQuestion.question}</div>
                                
                                ${this.state.feedback ? `
                                    <div class="feedback ${this.state.feedback.includes('正確') ? 'success' : 'error'}">
                                        ${this.state.feedback}
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="number-grid">
                                ${numbersHTML}
                            </div>
                        `;
                        
                        // 添加事件監聽器
                        for (let i = 1; i <= 9; i++) {
                            const btn = document.getElementById(`num-${i}`);
                            if (btn && !this.state.answered) {
                                btn.addEventListener('click', () => this.checkAnswer(i));
                            }
                        }
                    }
                }
            };
            
            // 初始化遊戲
            game.init();
        });
    </script>
</body>
</html>
